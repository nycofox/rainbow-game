<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080b1d" />
  <title>Rainbow Magic ✨</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
    body {
      background: radial-gradient(ellipse at 50% 42%, #17224a 0%, #0c1129 44%, #070a18 85%);
      color:#fff; font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
      cursor:none; user-select:none; -webkit-user-select:none; touch-action:none;
    }
    #sky { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
    #stars { position:fixed; inset:0; pointer-events:none; opacity:.65; }
    .star-dot { position:absolute; border-radius:50%; width:2px; height:2px; background:#e5ecff; box-shadow:0 0 9px #aecbff; animation: twinkle var(--t) ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity:.12; transform:scale(.65); } to { opacity:.85; transform:scale(1.6); } }
    #cursor {
      position:fixed; z-index:30; left:0; top:0; width:110px; height:110px;
      transform:translate(-50%, -50%); pointer-events:none;
      filter:drop-shadow(0 0 10px #ff7ae5) drop-shadow(0 0 24px #5bc8ff);
      will-change:left,top;
    }
    #cursor svg { width:100%; height:100%; overflow:visible; animation: floaty 2.5s ease-in-out infinite; }
    #cursor .outer { transform-origin:60px 60px; animation:spin 8s linear infinite; }
    #cursor .inner { transform-origin:60px 60px; animation:spinBack 7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes spinBack { to { transform:rotate(-360deg); } }
    @keyframes floaty { 50% { transform:scale(1.085); } }
    /* The cursor itself never scales or translates on click: its centre stays fixed. */
    #cursor.burst::after {
      content:""; position:absolute; inset:8px; border:5px solid #fff5ab;
      border-radius:50%; pointer-events:none;
      animation:cursorPop .35s ease-out both;
    }
    @keyframes cursorPop {
      from { opacity:.9; transform:scale(.55); }
      to   { opacity:0; transform:scale(1.75); }
    }
    #toolbar { position:fixed; z-index:50; top:16px; right:18px; display:flex; gap:10px; }
    .tool {
      color:#eaf3ff; background:#ffffff18; border:1px solid #ffffff25; border-radius:18px;
      padding:11px 14px; font:700 14px/1 system-ui,sans-serif; cursor:pointer;
      box-shadow:0 5px 20px #0004; backdrop-filter:blur(12px);
      transition:background .15s,transform .15s;
    }
    .tool:hover { background:#ffffff30; transform:scale(1.04); }
    .tool:focus-visible, #start:focus-visible { outline:3px solid #9feeff; outline-offset:4px; }
    #overlay { position:fixed; z-index:40; inset:0; display:grid; place-items:center; background:#070b1c99; backdrop-filter:blur(9px); }
    .welcome { text-align:center; padding:40px 28px; max-width:550px; }
    .welcome-emoji { display:block; font-size:clamp(64px,12vw,112px); filter:drop-shadow(0 0 25px #fa70fa); animation:bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform:translateY(-12px) rotate(9deg); } }
    h1 { font-size:clamp(36px,7vw,70px); line-height:1.1; margin:14px 0 12px; letter-spacing:-1.5px;
      background:linear-gradient(90deg,#ff79cd,#ffde62,#7cf2ac,#6dbaff,#bf91ff); color:transparent; background-clip:text; -webkit-background-clip:text; }
    p { color:#d2dbf8; font-size:clamp(17px,2.6vw,22px); line-height:1.5; }
    #start { border:0; color:#15132a; background:linear-gradient(120deg,#fff57b,#ff99d3,#8ee5ff); font:bold clamp(20px,3vw,28px) system-ui,sans-serif; padding:19px 34px; border-radius:999px; margin-top:20px; cursor:pointer; box-shadow:0 10px 50px #ed7dff5c; transition:transform .15s; }
    #start:hover { transform:scale(1.07); }
    .hint { position:fixed; z-index:10; bottom:25px; left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap; pointer-events:none; color:#b5c1e1; opacity:.8; font:600 clamp(12px,1.7vw,17px) system-ui,sans-serif; text-shadow:0 1px 8px #050916; }
    @media (pointer:coarse) { .hint { white-space:normal; width:90%; } }
    @media (prefers-reduced-motion:reduce) { .star-dot, #cursor svg, #cursor .outer, #cursor .inner, .welcome-emoji { animation:none; } }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="cursor" aria-hidden="true">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff65cc"/><stop offset="25%" stop-color="#ffd85a"/>
          <stop offset="48%" stop-color="#6df4b6"/><stop offset="72%" stop-color="#62bdff"/>
          <stop offset="100%" stop-color="#bf7aff"/>
        </linearGradient>
        <radialGradient id="core"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#fff7bd"/><stop offset="100%" stop-color="#ffabf1"/></radialGradient>
      </defs>
      <g class="outer">
        <circle cx="60" cy="60" r="45" fill="#131a43" fill-opacity=".67" stroke="url(#rainbow)" stroke-width="7" stroke-dasharray="10 5" />
        <circle cx="60" cy="60" r="51" fill="none" stroke="#cceaff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="2 13" />
      </g>
      <g class="inner">
        <path d="M60 13 L70 43 L101 43 L76 62 L85 93 L60 75 L35 93 L44 62 L19 43 L50 43 Z" fill="url(#rainbow)" stroke="white" stroke-width="3" stroke-linejoin="round" />
      </g>
      <circle cx="60" cy="60" r="15" fill="url(#core)" stroke="white" stroke-width="3" />
      <circle cx="60" cy="60" r="5" fill="#fff" />
    </svg>
  </div>
  <div class="hint" id="hint">Move the rainbow star! Click either mouse button to make magic! ✨</div>
  <div id="toolbar">
    <button class="tool" id="sound" type="button" aria-label="Mute sound">🔊 Sound on</button>
    <button class="tool" id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶ Fullscreen</button>
  </div>
  <div id="overlay">
    <div class="welcome">
      <span class="welcome-emoji" aria-hidden="true">🌈</span>
      <h1>Rainbow Magic!</h1>
      <p>Move the big rainbow star and click to make colorful fireworks!</p>
      <button id="start" type="button">✨ Let's Play! ✨</button>
    </div>
  </div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha:true });
  const cursor = document.getElementById('cursor');
  const overlay = document.getElementById('overlay');
  const soundButton = document.getElementById('sound');
  const fullscreenButton = document.getElementById('fullscreen');
  const hint = document.getElementById('hint');
  let w = innerWidth, h = innerHeight, dpr = 1;
  let x = w/2, y = h/2, enabled = false, muted = false, audio = null;
  let confetti = [], sparks = [], rings = [], flashes = [], lastFrame = 0, lastBurst = 0;
  const random = (a,b) => a+Math.random()*(b-a);
  const palette = ['#ff4faf','#ff7e5d','#ffd84b','#70f77c','#55e7ee','#658eff','#bb6bff','#ffffff'];
  const color = () => palette[Math.floor(Math.random()*palette.length)];

  function resize() {
    w = innerWidth; h = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    x = Math.max(0,Math.min(w,x)); y = Math.max(0,Math.min(h,y));
    positionCursor();
  }
  // Place the cursor by its actual viewport coordinates. Clamp its centre near edges
  // so the large rainbow icon remains visible, even in fullscreen.
  function positionCursor() {
    const margin = Math.min(51, w/2, h/2);
    cursor.style.left = Math.max(margin, Math.min(w-margin, x)) + 'px';
    cursor.style.top = Math.max(margin, Math.min(h-margin, y)) + 'px';
  }
  function cursorCentre() {
    return {x:parseFloat(cursor.style.left), y:parseFloat(cursor.style.top)};
  }
  function point(e) {
    x = Math.max(0,Math.min(w,e.clientX));
    y = Math.max(0,Math.min(h,e.clientY));
    positionCursor();
  }
  addEventListener('resize', resize);
  addEventListener('pointermove', point, {passive:true});
  resize();

  // Background stars are subtle, and no flashing full-screen effects are used.
  const stars = document.getElementById('stars');
  for (let i=0; i<55; i++) {
    const s=document.createElement('i'); s.className='star-dot';
    s.style.left=random(1,99)+'%'; s.style.top=random(2,98)+'%';
    s.style.setProperty('--t',random(2.4,5.5)+'s');
    s.style.animationDelay=-random(0,6)+'s';
    stars.appendChild(s);
  }

  function getAudio() {
    if (muted) return null;
    try {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      if (!audio) audio = new A();
      if (audio.state==='suspended') audio.resume().catch(()=>{});
      return audio;
    } catch (_) { return null; }
  }
  function tone(ac, start, freq, endFreq, duration, volume, type='sine') {
    const oscillator=ac.createOscillator(), gain=ac.createGain();
    oscillator.type=type;
    oscillator.frequency.setValueAtTime(freq,start);
    oscillator.frequency.exponentialRampToValueAtTime(Math.max(50,endFreq),start+duration);
    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(volume,start+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
    oscillator.connect(gain); gain.connect(ac.destination);
    oscillator.start(start); oscillator.stop(start+duration+.02);
  }
  function playSound() {
    const ac=getAudio(); if (!ac) return;
    const t=ac.currentTime+.004;
    const notes=[392,440,523.25,587.33,659.25,783.99,880,1046.5];
    const base=notes[Math.floor(Math.random()*notes.length)];
    tone(ac,t,base*.62,base*1.3,.18,.11,'sine');
    tone(ac,t+.07,base*1.25,base*1.8,.27,.075,'triangle');
    tone(ac,t+.15,base*2,base*2.18,.34,.04,'sine');
  }

  function burst(px,py) {
    const baseHue = random(0,360);
    // A modest amount of clearly rectangular, fluttering confetti.
    for(let i=0; i<36; i++) {
      const a=random(0,Math.PI*2), speed=random(2,8.5);
      confetti.push({x:px,y:py,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-1.8,
        gravity:random(.12,.21),drag:.987,life:random(70,125),maxLife:125,
        size:random(5,11),rotation:random(0,7),spin:random(-.18,.18),shade:color()});
    }
    // Bright radial FIREWORKS: three expanding spherical shells with long trails.
    // Sparks deliberately render AFTER the confetti so they cannot get buried.
    for(let shell=0;shell<3;shell++) {
      const count=[74,64,46][shell];
      const hue=(baseHue+[0,105,215][shell])%360;
      const angleOffset=random(0,Math.PI*2);
      for(let i=0;i<count;i++) {
        const a=angleOffset+i*2*Math.PI/count+random(-.05,.05);
        const speed=random(...[[6.7,9.7],[4.4,6.7],[2.8,4.8]][shell]);
        sparks.push({x:px,y:py,px,py,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
          gravity:.018,drag:random(.982,.993),life:random(55,83),maxLife:83,
          size:random(2,4.5),shade:`hsl(${(hue+random(-22,22)+360)%360} 100% ${random(65,87)}%)`});
      }
    }
    rings.push({x:px,y:py,r:8,life:31,maxLife:31,hue:baseHue,speed:7.8});
    rings.push({x:px,y:py,r:4,life:39,maxLife:39,hue:(baseHue+140)%360,speed:5.2});
    flashes.push({x:px,y:py,life:17,maxLife:17});
    if(confetti.length>450) confetti.splice(0,confetti.length-450);
    if(sparks.length>1200) sparks.splice(0,sparks.length-1200);
    if(rings.length>22) rings.splice(0,rings.length-22);
    cursor.classList.remove('burst'); void cursor.offsetWidth; cursor.classList.add('burst');
    playSound();
  }

  function draw(now) {
    const dt=Math.min((now-lastFrame)/16.6667 || 1,2);
    lastFrame=now;
    ctx.clearRect(0,0,w,h);

    // Confetti tumbles slowly downward; it remains distinct from the fireworks.
    for(let i=confetti.length-1;i>=0;i--) {
      const p=confetti[i];p.life-=dt;
      if(p.life<=0){confetti.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=Math.pow(p.drag,dt);p.vy=p.vy*Math.pow(p.drag,dt)+p.gravity*dt;
      p.rotation+=p.spin*dt;
      ctx.globalAlpha=Math.min(1,p.life/42);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);
      ctx.fillStyle=p.shade;ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.65);
      ctx.restore();
    }

    // Glowing centre flashes, two expanding rings, and luminous radial streaks.
    ctx.globalCompositeOperation='lighter';
    for(let i=flashes.length-1;i>=0;i--) {
      const p=flashes[i];p.life-=dt;
      if(p.life<=0){flashes.splice(i,1);continue;}
      const progress=1-p.life/p.maxLife;
      const radius=12+progress*60;
      const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);
      grad.addColorStop(0,`rgba(255,255,255,${.75*(1-progress)})`);
      grad.addColorStop(.25,`rgba(255,240,145,${.55*(1-progress)})`);
      grad.addColorStop(1,'rgba(255,180,240,0)');
      ctx.globalAlpha=1;ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();
    }
    for(let i=rings.length-1;i>=0;i--) {
      const p=rings[i];p.life-=dt;p.r+=p.speed*dt;
      if(p.life<=0){rings.splice(i,1);continue;}
      const alpha=Math.pow(p.life/p.maxLife,1.4);
      ctx.globalAlpha=alpha*.85;
      ctx.strokeStyle=`hsl(${p.hue} 100% 77%)`;
      ctx.lineWidth=3.7*alpha+1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    }
    for(let i=sparks.length-1;i>=0;i--) {
      const p=sparks[i];p.life-=dt;
      if(p.life<=0){sparks.splice(i,1);continue;}
      p.px=p.x;p.py=p.y;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=Math.pow(p.drag,dt);p.vy=p.vy*Math.pow(p.drag,dt)+p.gravity*dt;
      const alpha=Math.min(1,p.life/34);
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=p.shade;
      ctx.lineWidth=p.size;
      ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-p.vx*3.8,p.y-p.vy*3.8);ctx.stroke();
      // Larger bright star tips make the radial firework pattern unmistakable.
      ctx.fillStyle=p.shade;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*.68,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function clickMagic(e) {
    if(!enabled || (e.button!==0 && e.button!==2)) return;
    if(e.target.closest('#toolbar')) return;
    e.preventDefault(); point(e);
    // Avoid duplicate accidental click events from touch and some input devices.
    if(performance.now()-lastBurst<65) return;
    lastBurst=performance.now();
    const centre=cursorCentre();
    burst(centre.x,centre.y);
    hint.style.opacity='0';
  }
  document.addEventListener('pointerdown',clickMagic);
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('dragstart',e=>e.preventDefault());

  async function toggleFullscreen() {
    try {
      if(document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) { /* fullscreen may not be supported, or blocked in embedded browsers */ }
    updateFullscreenLabel();
  }
  function updateFullscreenLabel(){fullscreenButton.textContent=document.fullscreenElement?'⛶ Exit fullscreen':'⛶ Fullscreen';}
  document.addEventListener('fullscreenchange',updateFullscreenLabel);
  fullscreenButton.addEventListener('pointerdown',e=>e.stopPropagation());
  soundButton.addEventListener('pointerdown',e=>e.stopPropagation());
  fullscreenButton.addEventListener('click',toggleFullscreen);
  soundButton.addEventListener('click',()=>{
    muted=!muted;soundButton.textContent=muted?'🔇 Sound off':'🔊 Sound on';
    soundButton.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');
    if(!muted)getAudio();
  });

  document.getElementById('start').addEventListener('click',()=>{
    enabled=true;overlay.remove();getAudio();
    document.documentElement.requestFullscreen?.().catch(()=>{});
    const centre=cursorCentre(); burst(centre.x,centre.y);
  });
  // Keyboard fallback for children using other input devices.
  document.addEventListener('keydown',e=>{
    if(e.key.toLowerCase()==='f' && enabled){e.preventDefault();toggleFullscreen();}
    if((e.key===' '||e.key==='Enter')&&enabled&&e.target===document.body){e.preventDefault();const c=cursorCentre();burst(c.x,c.y);}
  });
})();
</script>
</body>
</html>
